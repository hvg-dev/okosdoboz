<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Okosdoboz | Feladat</title>
    <link rel="stylesheet" href="src/shell.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body class="parcel-lesson-shell">
    <header class="shell-header">
      <a class="shell-brand" href="./">Okosdoboz<span>Feladatok</span></a>
      <button id="fullscreen" class="icon-button" type="button" title="Teljes képernyő" aria-label="Teljes képernyő"><i data-lucide="maximize"></i></button>
    </header>
    <main id="experience">
      <div id="status" role="status" aria-live="polite">Feladat betöltése...</div>
      <button id="retry" type="button" hidden>Újratöltés</button>
      <div class="lesson-container"><div id="odPlayer" class="odPlayer" playersize="embedded"></div></div>
    </main>
  </body>
</html>
